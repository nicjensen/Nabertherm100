name: build-and-publish

on:
  schedule:
    - cron: "17 * * * *"      # hourly; catches the ~13:00 CET publication of tomorrow's prices
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parity check against the Home Assistant card
        run: |
          python -m pip install --quiet jinja2
          python parity_test.py

      - name: Build the page
        run: python build.py --out docs

      - name: Commit if the numbers changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update kiln price table $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
