name: build-and-publish

on:
  schedule:
    # Tomorrow's prices are published around 13:00 local time, so the numbers change only once a
    # day. The run is hourly anyway, as a guard: GitHub's scheduler is best-effort and has
    # executed these builds about six hours late, and an hourly attempt means a delayed or
    # skipped run still lands the new prices the same afternoon. It costs nothing, because
    # build.py carries the previous timestamp over while the prices are unchanged, so the commit
    # step below finds no diff and the page is not redeployed. Hourly in UTC is DST-proof too.
    - cron: "15 * * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checks (card parity, tariffs, DST)
        run: |
          python -m pip install --quiet jinja2
          python parity_test.py
          python tariff_test.py
          python dst_check.py

      - name: Build the page
        env:
          ENERGIDATA_API_KEY: ${{ secrets.ENERGIDATA_API_KEY }}
        run: python build.py --out docs

      - name: Refresh the official tariff snapshot (monthly)
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            python refresh_tariffs.py --refresh
          else
            echo "not the 1st — keeping the committed snapshot"
          fi

      - name: Commit if the numbers changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs tariffs_datahub.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update kiln price table $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
