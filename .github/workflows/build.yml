name: build-and-publish

on:
  schedule:
    # One update a day, at 13:10 local time: tomorrow's prices are published around 13:00 and
    # nothing changes for the rest of the day.
    # Two UTC entries because of DST — 13:10 CET is 12:10 UTC and 13:10 CEST is 11:10 UTC — so
    # the run lands at 13:10 in winter and in summer. The entry that is an hour off fires before
    # the publication, so it finds nothing new; build.py's payload fingerprint then keeps the
    # previous timestamp and the commit step below has no diff to commit.
    - cron: "10 12 * * *"      # 13:10 CET (winter)
    - cron: "10 11 * * *"      # 13:10 CEST (summer)
  workflow_dispatch:
  # Dispatchable over the API with a Contents:write token (no Actions permission needed). This is
  # how the page gets refreshed on time: GitHub's scheduler has run these builds 6-7 hours late and
  # skipped a day outright, so the daily schedule below is only a backstop.
  repository_dispatch:
    types: [ refresh ]
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checks (card parity, tariffs, DST)
        run: |
          python -m pip install --quiet jinja2
          python parity_test.py
          python tariff_test.py
          python dst_check.py

      - name: Build the page
        env:
          ENERGIDATA_API_KEY: ${{ secrets.ENERGIDATA_API_KEY }}
        run: python build.py --out docs

      - name: Refresh the official tariff snapshot (monthly)
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            python refresh_tariffs.py --refresh
          else
            echo "not the 1st — keeping the committed snapshot"
          fi

      - name: Commit if the numbers changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs tariffs_datahub.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update kiln price table $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
