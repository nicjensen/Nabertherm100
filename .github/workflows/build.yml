name: build-and-publish

on:
  schedule:
    # Tomorrow's prices are published around 13:00 local time, so one run a day is enough.
    # Two UTC entries because of DST: 13:15 in winter (CET, UTC+1) and 13:15 in summer
    # (CEST, UTC+2) — a single entry would drift an hour and could miss the publication.
    - cron: "15 12 * * *"      # 13:15 CET
    - cron: "15 11 * * *"      # 13:15 CEST
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checks (card parity, tariffs, DST)
        run: |
          python -m pip install --quiet jinja2
          python parity_test.py
          python tariff_test.py
          python dst_check.py

      - name: Build the page
        env:
          ENERGIDATA_API_KEY: ${{ secrets.ENERGIDATA_API_KEY }}
        run: python build.py --out docs

      - name: Refresh the official tariff snapshot (monthly)
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            python refresh_tariffs.py --refresh
          else
            echo "not the 1st — keeping the committed snapshot"
          fi

      - name: Commit if the numbers changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs tariffs_datahub.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update kiln price table $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
